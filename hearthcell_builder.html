<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hearthcell Army Builder v0.6</title>

  <style>
    /* ===============================
       THEME & TYPOGRAPHY
       =============================== */
    :root{
      --bg:#0e0f12;
      --panel:#151821;
      --panel2:#10131a;
      --text:#e9ecf1;
      --muted:#aab3c2;
      --accent:#c9a227;
      --bad:#ff5c7a;
      --good:#58d68d;
      --line:#2a3242;
      --chip:#1e2431;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    *{ box-sizing:border-box }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
    }

    header{
      padding:16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#141726,#0e0f12);
    }

    h1{ margin:0; font-size:18px }
    h2{ margin:0 0 8px; font-size:14px }

    main{
      padding:16px;
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:16px;
    }

    @media(max-width:1100px){
      main{ grid-template-columns:1fr }
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
    }

    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap }
    .grow{ flex:1 }

    input, select, textarea, button{
      background:var(--panel2);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 10px;
      font-size:13px;
    }

    button{ cursor:pointer }
    button:hover{ border-color:#3a4660 }

    .btnAccent{
      background:rgba(201,162,39,.15);
      border-color:rgba(201,162,39,.35);
    }

    .btnBad{
      background:rgba(255,92,122,.12);
      border-color:rgba(255,92,122,.35);
    }

    .pill{
      padding:4px 10px;
      border-radius:999px;
      background:var(--chip);
      border:1px solid var(--line);
      font-size:12px;
      color:var(--muted);
    }

    .pill strong{ color:var(--text) }

    .hr{ height:1px; background:var(--line); margin:10px 0 }

    .tag{
      display:inline-block;
      padding:2px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#111523;
      font-size:11px;
      color:var(--muted);
      margin-right:6px;
      margin-bottom:4px;
    }

    .small{ font-size:12px }
    .mono{ font-family:var(--mono) }

    .ok{
      background:rgba(88,214,141,.07);
      border:1px solid rgba(88,214,141,.3);
      padding:8px;
      border-radius:8px;
      font-size:12px;
    }

    .warn{
      background:rgba(255,92,122,.08);
      border:1px solid rgba(255,92,122,.35);
      padding:8px;
      border-radius:8px;
      font-size:12px;
    }
  </style>
</head>

<body>
<header>

    <div>

</main>

/* =====================================
   ARSENAL LOGIC
   ===================================== */

function addToArsenal(kitId, qty=1){
  state.arsenal[kitId] = (state.arsenal[kitId]||0) + qty;
}

function removeFromArsenal(kitId, qty=1){
  if(!state.arsenal[kitId]) return;
  state.arsenal[kitId] -= qty;
  if(state.arsenal[kitId] <= 0) delete state.arsenal[kitId];
}

function renderArsenal(){
  const el = document.getElementById("arsenalContainer");
  el.innerHTML = "";

  const entries = Object.entries(state.arsenal);
  if(!entries.length){
    el.innerHTML = `<div class="small" style="color:#aab3c2">No items in Arsenal.</div>`;
    return;
  }

  for(const [kit,qty] of entries){
    const row = document.createElement("div");
    row.textContent = `${kit} × ${qty}`;
    el.appendChild(row);
  }
}

   STATUS
   ===================================== */

/* =========================

const TROOP_ALLOWED = new Set([
  "pistol","shotgun","bolt_action_rifle",
  "trench_knife","trench_club","sword_axe",
  "frag_grenades",
  "standard_armour","combat_helmet","gas_mask","medi_kit",

]);

const TROOP_BANNED = new Set([
  "machine_gun","sniper_rifle","flamethrower",
  "reinforced_armour"
]);

function isEliteUnit(unitId){
  const u = UNIT_DEFS[unitId];
  return u && u.type === "ELITE";
}

/* =========================
   COSTS / LIMITS / VALIDATION
   ========================= */

function kitCostForModel(model, itemId){
  const item = BATTLEKIT[itemId];
  if(!item) return 0;

  // Hearthcell special: Satchel Charge discount for Sapper’s Mate only
  if(itemId === "satchel_charge" && model.unitId === "sappers_mate"){
    return 10;
  }
  return item.cost;
}

function modelTotalCost(model){
  const def = UNIT_DEFS[model.unitId];
  if(!def) return 0;
  let sum = def.baseCost;
  for(const k of (model.kit || [])){
    sum += kitCostForModel(model, k);
  }
  return sum;
}

function warbandTotalCost(){
  return [...state.models].reduce((a,m)=>a+modelTotalCost(m),0);
}

function warbandModelCount(){
  return state.models.length;
}

function countItemAcrossWarband(itemId){
  let c = 0;
  for(const m of state.models){
    if((m.kit||[]).includes(itemId)) c += 1;
  }
  return c;
}

function itemWarbandLimit(itemId){
  const item = BATTLEKIT[itemId];
  return item?.limitWarband ?? null;
}

function canModelTakeItem(model, itemId){
  const def = UNIT_DEFS[model.unitId];
  const item = BATTLEKIT[itemId];
  if(!def || !item) return { ok:false, reason:"Unknown unit or item." };

  const isElite = def.type === "ELITE";
  const isTroop = def.type === "TROOP";

  // Troop restrictions
  if(isTroop){
    if(TROOP_BANNED.has(itemId)) return { ok:false, reason:"Troops cannot take this item." };
    if(!TROOP_ALLOWED.has(itemId)) return { ok:false, reason:"Troops may only take items from the Hearthcell Troop list." };
  }

  // Elite-only items (but Hearthcell says Elites may take any NA battlekit)
  if(item.eliteOnly && !isElite){
    // Hearthcell override: binoculars are allowed for troops (special list includes them)
    if(itemId === "binoculars" && isTroop) {
      // allow
    } else {
      return { ok:false, reason:"ELITE only item." };
    }
  }

  // Per-model limit
  if(item.perModelLimit && (model.kit||[]).filter(x=>x===itemId).length >= item.perModelLimit){
    return { ok:false, reason:"Limit: 1 per model." };
  }

  // Body / Head uniqueness
  if(item.body && (model.kit||[]).some(x => BATTLEKIT[x]?.body)){
    return { ok:false, reason:"Only one body armour item per model." };
  }
  if(item.head && (model.kit||[]).some(x => BATTLEKIT[x]?.head)){
    return { ok:false, reason:"Only one headgear item per model." };
  }

  // Hands check (very simple)
  const handsUsed = (model.kit||[]).reduce((a,x)=>a+(BATTLEKIT[x]?.hands||0),0);
  if((item.hands||0) > 0 && handsUsed + item.hands > 2){
    return { ok:false, reason:"Not enough hands (max 2)." };
  }

  // Warband limit
  const lim = itemWarbandLimit(itemId);
  if(lim !== null){
    const current = countItemAcrossWarband(itemId);
    if(current >= lim) return { ok:false, reason:`Warband Limit reached (${lim}).` };
  }

  return { ok:true, reason:"" };
}

/* =========================
   QUARTERMASTER: ARSENAL
   ========================= */

function arsenalQty(itemId){
  return state.arsenal[itemId] || 0;
}

function addToArsenal(itemId, qty=1){
  if(!state.arsenal[itemId]) state.arsenal[itemId]=0;
  state.arsenal[itemId]+=qty;
  if(state.arsenal[itemId]<=0) delete state.arsenal[itemId];
}

function removeFromArsenal(itemId, qty=1){
  addToArsenal(itemId, -qty);
}

function autoSellOverLimit(itemId, sellRate=DEFAULT_SELL_RATE){
  const lim = itemWarbandLimit(itemId);
  if(lim === null) return;

  const currentOnModels = countItemAcrossWarband(itemId);
  const totalOwned = currentOnModels + arsenalQty(itemId);

  if(totalOwned <= lim) return;

  const excess = totalOwned - lim;
  const sellEach = Math.max(0, Math.floor((BATTLEKIT[itemId].cost || 0) * sellRate));
  removeFromArsenal(itemId, Math.min(excess, arsenalQty(itemId))); // only sell from arsenal
  state.ducats += sellEach * Math.min(excess, arsenalQty(itemId) + excess); // safe-ish
  logEvent(`Quartermaster auto-sold ${excess}× ${BATTLEKIT[itemId].name} for ${sellEach*excess} ducats (over warband limit).`);
}

function enforceAllArsenalLimits(){
  for(const itemId of Object.keys(state.arsenal)){
    autoSellOverLimit(itemId);
  }
}

/* =========================
   MODEL CRUD
   ========================= */

function addModel(unitId){
  const def = UNIT_DEFS[unitId];
  if(!def) return;

  const m = {
    id: uid(),
    unitId,
    name: def.name,
    status: "Active",
    notes: "",
    kit: [...(def.defaultLoadout || [])],
    injuries: [],
    scars: [],
    promotionsFailed: 0,
    progression: []
  };

  // Apply legality: remove anything illegal (shouldn't happen often)
  m.kit = m.kit.filter(itemId => canModelTakeItem(m, itemId).ok);

  state.models.push(m);
  logEvent(`Added model: ${def.name}.`);
}

function deleteModel(modelId){
  state.models = state.models.filter(m=>m.id!==modelId);
  logEvent(`Deleted model.`);
}

function killModel(modelId){
  const idx = state.models.findIndex(m=>m.id===modelId);
  if(idx<0) return;
  const [m] = state.models.splice(idx,1);
  m.status = "Dead";
  state.dead.push(m);
  logEvent(`${m.name} was marked Dead and moved to the Dead list.`);
}

function reviveModel(modelId){
  const idx = state.dead.findIndex(m=>m.id===modelId);
  if(idx<0) return;
  const [m] = state.dead.splice(idx,1);
  m.status = "Active";
  state.models.push(m);
  logEvent(`${m.name} was restored to Active models.`);
}

/* =========================
   KIT PICKER / ARSENAL TRANSFERS
   ========================= */

function giveItemToModelFromArsenal(modelId, itemId){
  const m = state.models.find(x=>x.id===modelId);
  if(!m) return;

  if(arsenalQty(itemId) <= 0){
    alert("Not in Arsenal.");
    return;
  }

  const check = canModelTakeItem(m, itemId);
  if(!check.ok){
    alert(check.reason);
    return;
  }

  removeFromArsenal(itemId, 1);
  m.kit.push(itemId);
  logEvent(`Issued ${BATTLEKIT[itemId].name} to ${m.name} from Arsenal.`);
}

function returnItemToArsenal(modelId, itemId){
  const m = state.models.find(x=>x.id===modelId);
  if(!m) return;

  const i = (m.kit||[]).indexOf(itemId);
  if(i<0) return;

  m.kit.splice(i,1);
  addToArsenal(itemId,1);

  // Quartermaster: auto-sell if this pushes us over limit
  enforceAllArsenalLimits();

  logEvent(`${m.name} returned ${BATTLEKIT[itemId].name} to Arsenal.`);
}

function buyToArsenal(itemId, qty=1){
  const item = BATTLEKIT[itemId];
  if(!item) return;

  // Buying uses ducats (you can rename/decide economy later)
  const cost = item.cost * qty;
  if(state.ducats < cost){
    alert(`Not enough ducats. Need ${cost}.`);
    return;
  }
  state.ducats -= cost;
  addToArsenal(itemId, qty);

  // Quartermaster: enforce limits after purchase
  enforceAllArsenalLimits();

  logEvent(`Bought ${qty}× ${item.name} into Arsenal for ${cost} ducats.`);
}

/* =========================
   AUTOPICK LEGAL FORCE (simple)
   - Ensures each model has a legal kit
   - Removes illegal items
   - Optionally issues core Troop kit if empty
   ========================= */

function autopickLegalForce(){
  for(const m of state.models){
    // Strip illegal items
    m.kit = (m.kit||[]).filter(itemId => canModelTakeItem(m, itemId).ok);

    // If Troop ends up empty, give them a knife by default
    const def = UNIT_DEFS[m.unitId];
    if(def?.type==="TROOP" && m.kit.length===0){
      if(canModelTakeItem(m,"trench_knife").ok) m.kit.push("trench_knife");
    }
  }
  logEvent("Auto-pick legal force applied (illegal kit removed; empty Troops given basic kit).");
}

/* =========================
   KIT PICKER MODAL
   ========================= */

function openKitPicker(modelId){
  const m = state.models.find(x=>x.id===modelId);
  if(!m) return;

  const def = UNIT_DEFS[m.unitId];
  const isTroop = def.type === "TROOP";

  const items = Object.values(BATTLEKIT).filter(it=>{
    if(isTroop){
      return TROOP_ALLOWED.has(it.id) && !TROOP_BANNED.has(it.id);
    }
    return true; // Elites: anything (still subject to canModelTakeItem checks)
  });

  // Build table
  const rows = items.map(it=>{
    const check = canModelTakeItem(m, it.id);
    const owned = arsenalQty(it.id);
    const cost = kitCostForModel(m, it.id);
    const profile = it.profile ? `${it.profile.type} • ${it.profile.range} • ${it.profile.keywords.join(", ")}` : "";
    const lim = itemWarbandLimit(it.id);
    const limTxt = (lim!==null) ? `Limit ${lim}` : "";
    return `
      <div class="row" style="justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #222;">
        <div style="min-width:220px;">
          <div><b>${escapeHtml(it.name)}</b> <span class="muted">${cost} ${state.currencyName}</span></div>
          <div class="muted">${escapeHtml(it.cat)} ${limTxt ? "• "+limTxt : ""}</div>
          ${profile ? `<div class="muted">${escapeHtml(profile)}</div>` : ""}
          ${it.rules ? `<div class="muted">${escapeHtml(it.rules.join(" "))}</div>` : ""}
        </div>
        <div class="right">
          <div class="muted">Arsenal: ${owned}</div>
          <div style="height:6px"></div>
          <button class="btn" ${(!check.ok || owned<=0) ? "disabled" : ""} onclick="giveItemToModelFromArsenal('${m.id}','${it.id}')">Issue</button>
          ${!check.ok ? `<div class="muted" style="margin-top:6px; max-width:260px;">${escapeHtml(check.reason)}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  const modal = el("modal");
  const modalInner = el("modalInner");
  modalInner.innerHTML = `
    <div class="row" style="justify-content:space-between; gap:10px; align-items:flex-start;">
      <div>
        <div class="h2">Kit Picker</div>
        <div class="muted">${escapeHtml(m.name)} • ${escapeHtml(def.name)}</div>
        <div class="muted">Tip: Buy into Arsenal first, then Issue here.</div>
      </div>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
    <div style="height:12px"></div>
    <div class="card">${rows}</div>
  `;
  modal.classList.remove("hidden");
}

function closeModal(){
  el("modal").classList.add("hidden");
  el("modalInner").innerHTML = "";
}

/* =========================
   PRINT ROSTER (quick reference)
   ========================= */

function weaponBlock(itemId){
  const it = BATTLEKIT[itemId];
  if(!it) return "";
  if(!it.profile) return `<div class="muted">• ${escapeHtml(it.name)}</div>`;
  return `
    <div class="muted">• <b>${escapeHtml(it.name)}</b>: ${escapeHtml(it.profile.type)} | ${escapeHtml(it.profile.range)} | ${escapeHtml((it.profile.keywords||[]).join(", "))}</div>
    ${it.rules ? `<div class="muted" style="margin-left:12px;">${escapeHtml(it.rules.join(" "))}</div>` : ""}
  `;
}

function printRoster(){
  const w = window.open("", "_blank");
  const lines = state.models.map(m=>{
    const def = UNIT_DEFS[m.unitId];
    const kit = (m.kit||[]);
    const weapons = kit.filter(x=>["RANGED","MELEE","GRENADES"].includes(BATTLEKIT[x]?.cat));
    const gear = kit.filter(x=>["ARMOUR","EQUIPMENT"].includes(BATTLEKIT[x]?.cat));
    return `
      <div style="border:1px solid #333; padding:12px; margin:12px 0;">
        <h2 style="margin:0 0 4px 0;">${escapeHtml(m.name)} <span style="font-weight:normal; color:#666;">(${escapeHtml(def.name)})</span></h2>
        <div style="color:#666;">Cost: ${modelTotalCost(m)} ${state.currencyName} | Profile: M${def.profile.M} A${def.profile.A} R${def.profile.R} D${def.profile.D} W${def.profile.W}</div>
        <div style="color:#666;">Keywords: ${escapeHtml(def.keywords.join(", "))}</div>

        <h3 style="margin:10px 0 4px 0;">Abilities</h3>
        ${(def.abilities||[]).map(a=>`<div style="color:#444;"><b>${escapeHtml(a.name)}:</b> ${escapeHtml(a.text)}</div>`).join("")}

        <h3 style="margin:10px 0 4px 0;">Weapons</h3>
        ${weapons.length ? weapons.map(weaponBlock).join("") : `<div style="color:#666;">None</div>`}

        <h3 style="margin:10px 0 4px 0;">Armour & Equipment</h3>
        ${gear.length ? gear.map(x=>`<div style="color:#666;">• ${escapeHtml(BATTLEKIT[x].name)}</div>`).join("") : `<div style="color:#666;">None</div>`}
      </div>
    `;
  }).join("");

  w.document.write(`
    <html><head><title>${escapeHtml(state.warbandName)} Roster</title></head>
    <body style="font-family:Arial, sans-serif; padding:16px;">
      <h1 style="margin:0 0 8px 0;">${escapeHtml(state.warbandName)}</h1>
      <div style="color:#666; margin-bottom:12px;">Total: ${warbandTotalCost()} ${state.currencyName} | Models: ${warbandModelCount()}</div>
      ${lines || "<div>No models.</div>"}
    </body></html>
  `);
  w.document.close();
  w.focus();
  w.print();
}

/* =========================
   SAVE / LOAD
   ========================= */

function saveToFile(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hearthcell_builder_save.json";
  a.click();
  URL.revokeObjectURL(a.href);
  logEvent("Exported JSON.");
}

function loadFromFile(){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const obj = JSON.parse(reader.result);
        state = obj;
        // safety defaults
        state.arsenal = state.arsenal || {};
        state.models = state.models || [];
        state.dead = state.dead || [];
        state.log = state.log || [];
        enforceAllArsenalLimits();
        logEvent("Imported JSON.");
      }catch(e){
        alert("Could not import JSON.");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* =========================
   BOOT
   ========================= */

(function boot(){
  // Friendly starter resources
  if(state.log.length===0){
    logEvent("Builder initialised.");
    state.ducats = 50; // small starter pool so you can test buying
    logEvent("Starter ducats set to 50 for testing. Change/remove this when you want strict campaign economy.");
  }
  renderAll();
})();
