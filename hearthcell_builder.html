<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hearthcell Warband Builder v0.7</title>

<style>
body {
  font-family: serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

h1, h2, h3 {
  margin-bottom: 0.25em;
}

.section {
  background: #ffffff;
  padding: 15px;
  margin-bottom: 20px;
  border: 1px solid #ccc;
}

button {
  padding: 6px 10px;
  margin: 4px 0;
}

.model-card {
  border: 1px solid #888;
  padding: 10px;
  margin-bottom: 10px;
}

.statline {
  font-style: italic;
  margin-bottom: 5px;
}

.ability {
  margin-bottom: 6px;
}

.keywords {
  font-size: 0.9em;
  color: #444;
}
</style>
</head>

<body>

<h1>Hearthcell Resistance — Warband Builder (v0.7)</h1>

<div class="section">
  <h2>Warband Controls</h2>
  <button id="fixRoster">Fix / Auto-Equip Roster</button><br>
  <button id="suggestWarband">Suggest Legal Warband (700 👑)</button>
</div>

<div class="section">
  <h2>Roster</h2>
  <div id="roster"></div>
</div>

<script>
/* ===========================
   HEARTHCELL UNIT DEFINITIONS
   VERIFIED — DO NOT EDIT
   =========================== */

const UNITS = {

  /* ===== ELITES ===== */

  cellMarshal: {
    name: "Cell Marshal",
    cost: 85,
    limit: 1,
    role: "Elite",
    stats: { move: '6"', ranged: '+0', melee: '+1', armour: 0 },
    abilities: [
      {
        name: "Co-ordinate ACTION",
        text: "Take a Risky Success Roll for the Cell Marshal. If the roll is a Failure, the Cell Marshal’s Activation ends immediately. If the roll is a Success or Critical Success, choose one friendly HEARTHCELL TROOP model within 6\" that is not Down or Out of Action. The chosen model may immediately move up to D3\". This move is not an ACTION."
      },
      {
        name: "No One Left Behind",
        text: "Friendly HEARTHCELL models within 8\" of the Cell Marshal have the NEGATE FEAR Keyword."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","ELITE","NEGATE FEAR"]
  },

  weaver: {
    name: "Weaver of Ciphers",
    cost: 80,
    limit: 1,
    role: "Elite",
    stats: { move: '6"', ranged: '+0', melee: '+0', armour: 0 },
    abilities: [
      {
        name: "Stitch-Count ACTION",
        text: "Take a Risky Success Roll for this model. If the roll is a Failure, the model’s Activation ends immediately. If the roll is a Success or Critical Success, place 1 CIPHER MARKER next to an enemy model within 24\" that is in this model’s Line of Sight. There can be a maximum of 2 CIPHER MARKERS on the battlefield at any one time."
      },
      {
        name: "Spent Signal",
        text: "When a friendly model makes a Ranged Attack against an enemy model with a CIPHER MARKER, you may remove 1 CIPHER MARKER from that enemy to add +1 DICE to the Success Roll for that Ranged Attack."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","ELITE"]
  },

  wardAngel: {
    name: "Ward Angel",
    cost: 85,
    limit: 1,
    role: "Elite",
    stats: { move: '6"', ranged: '–', melee: '+0', armour: -1 },
    abilities: [
      {
        name: "Battlefield Surgeon",
        text: "Add +2 DICE to the Risky Success Roll when this model carries out a Treat ACTION with their Medi-kit."
      },
      {
        name: "Mercy Cut",
        text: "Add +1 DICE to Injury Rolls for Melee Attacks made by this model if the target is Down and does not have the BLACK GRAIL or DEMONIC Keywords."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","ELITE"]
  },

  fuseSister: {
    name: "Fuse-Sister",
    cost: 80,
    limit: 1,
    role: "Elite",
    stats: { move: '6"', ranged: '+0', melee: '+0', armour: 0 },
    abilities: [
      {
        name: "Careful Hands",
        text: "Add +1 DICE to Risky Success Rolls taken for this model when performing an ACTION involving Explosives (such as throwing a Satchel Charge, or using the Defuse Mine or Rig the Approach Actions)."
      },
      {
        name: "Rig the Approach",
        text: "Once per game, if this model is within 1\" of a terrain piece, you may take a Risky Success Roll. If successful, place a Booby Trap Marker on that terrain. The first enemy model to move within 1\" of that terrain triggers the trap; the model suffers an Injury Roll with the SHRAPNEL Keyword [TCDR 572]. Then, remove the marker."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","ELITE"]
  },

  docksideGiant: {
    name: "Dockside Giant",
    cost: 85,
    limit: 1,
    role: "Elite",
    stats: { move: '6"', ranged: '+0', melee: '+2', armour: 0 },
    abilities: [
      {
        name: "Break the Line",
        text: "When you roll the Charge Bonus for a Dockside Giant, roll 1 extra D6 and use the single highest die to determine the bonus."
      },
      {
        name: "Meat and Metal",
        text: "Add -1 INJURY DICE to Injury Rolls for attacks made against this model with weapons that do not have the HEAVY Keyword."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","ELITE","STRONG"]
  }

  /* TROOPS CONTINUE IN PART 2 */
};
</script>

<script>
/* ===========================
   TROOPS DEFINITIONS
   VERIFIED — DO NOT EDIT
   =========================== */

Object.assign(UNITS, {

  streetUrchin: {
    name: "Street Urchin",
    cost: 18,
    limit: 6,
    role: "Troop",
    stats: { move: '7"', ranged: '–', melee: '-1', armour: 0 },
    abilities: [
      {
        name: "Scurry Into the Gutter",
        text: "Once per Turn, when a Street Urchin is declared as the target of a Ranged Attack, after the attack (including any Injury Rolls) has been fully resolved, if the model is not Down or Out of Action, it may immediately move D3\". This move cannot be used to move within 1\" of an enemy model."
      },
      {
        name: "Street Packs",
        text: "A Street Urchin adds +1 DICE to Success Rolls for Melee Attacks if at least one other friendly Street Urchin is within 1\" of the same enemy model."
      },
      {
        name: "Children of the Ruins",
        text: "Street Urchins cannot be Promoted."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","TROOPS"]
  },

  lookout: {
    name: "Lookout",
    cost: 28,
    limit: 3,
    role: "Troop",
    stats: { move: '7"', ranged: '+0', melee: '-1', armour: 0 },
    abilities: [
      {
        name: "Mark the Kill (ACTION)",
        text: "Choose one enemy model within 24\" and Line of Sight. Take a Risky Success Roll for the Lookout. If the roll is a Failure, the Lookout’s Activation ends immediately. If the roll is a Success or Critical Success, until the end of the Turn, the first friendly model to make a Ranged Attack against that enemy adds +1 DICE to the Success Roll."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","TROOPS"]
  },

  bruiser: {
    name: "Bruiser",
    cost: 45,
    limit: 3,
    role: "Troop",
    stats: { move: '6"', ranged: '+0', melee: '+1', armour: 0 },
    abilities: [
      {
        name: "Crowd Violence",
        text: "If this model successfully completes a Charge against an enemy model that is already within 1\" of at least one other friendly model, add +1 DICE to the Success Roll for its first Melee Attack during that Activation."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","TROOPS"]
  },

  fieldMedic: {
    name: "Field Medic",
    cost: 40,
    limit: 2,
    role: "Troop",
    stats: { move: '6"', ranged: '+0', melee: '+0', armour: 0 },
    abilities: [
      {
        name: "Street Triage",
        text: "Add +1 DICE to the Risky Success Roll when this model carries out a Treat ACTION with their Medi-kit."
      },
      {
        name: "Stretcher Bearers (ACTION)",
        text: "Two Field Medics that form a FIRETEAM may use this ability. If both Medics start their Activation within 1\" of the same friendly model that is Down, they may take a joint Move ACTION to carry that model. If they do so, they may move the Down model along with them. The Down model must remain within 1\" of both Medics throughout the move. During this move, the Medics have their Movement Characteristic halved [WoTC 404]. This move cannot be a Charge or Retreat."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","TROOPS"]
  },

  sapperMate: {
    name: "Sapper’s Mate",
    cost: 45,
    limit: 3,
    role: "Troop",
    stats: { move: '6"', ranged: '+0', melee: '+0', armour: 0 },
    abilities: [
      {
        name: "Fuse Runner",
        text: "Once per battle, after a friendly model within 6\" successfully carries out a Ranged Attack with a Satchel Charge, this model may immediately move D3\". This move is not an ACTION and may be taken even if the Sapper’s Mate has already been Activated this Turn."
      },
      {
        name: "Improvised Explosives",
        text: "Satchel Charges purchased for a Sapper’s Mate cost 10 👑 each. This does not ignore the standard Limit: 3 (1 per model) stipulation for Satchel Charges in a warband."
      }
    ],
    keywords: ["NEW ANTIOCH","HEARTHCELL","TROOPS"]
  }

});

/* ===========================
   ROSTER STATE
   =========================== */

let roster = [];

/* ===========================
   RENDERING
   =========================== */

function renderRoster() {
  const container = document.getElementById("roster");
  container.innerHTML = "";

  roster.forEach((model, index) => {
    const card = document.createElement("div");
    card.className = "model-card";

    card.innerHTML = `
      <strong>${model.name}</strong> (${model.role}) — ${model.cost} 👑
      <div class="statline">
        Move: ${model.stats.move} • Ranged: ${model.stats.ranged} • Melee: ${model.stats.melee} • Armour: ${model.stats.armour}
      </div>
      ${model.abilities.map(a => `
        <div class="ability">
          <strong>${a.name}:</strong> ${a.text}
        </div>
      `).join("")}
      <div class="keywords">Keywords: ${model.keywords.join(", ")}</div>
    `;

    container.appendChild(card);
  });
}

/* ===========================
   WAR BAND GENERATOR
   =========================== */

function suggestWarband() {
  if (!confirm("This will clear your roster and generate a legal 700 👑 Hearthcell warband. Continue?")) return;

  roster = [];

  // Mandatory Cell Marshal
  roster.push({...UNITS.cellMarshal});

  // 1–2 additional Elites
  const elitePool = ["weaver","wardAngel","fuseSister","docksideGiant"];
  const eliteCount = Math.random() < 0.5 ? 1 : 2;

  elitePool.sort(() => 0.5 - Math.random());
  elitePool.slice(0, eliteCount).forEach(e => roster.push({...UNITS[e]}));

  // Fill with Troops
  const troopKeys = ["streetUrchin","streetUrchin","streetUrchin","lookout","bruiser","fieldMedic","sapperMate"];
  let points = roster.reduce((s,m)=>s+m.cost,0);

  for (let k of troopKeys) {
    if (roster.length >= 10) break;
    if (points + UNITS[k].cost > 700) break;
    roster.push({...UNITS[k]});
    points += UNITS[k].cost;
  }

  renderRoster();
}

/* ===========================
   BUTTONS
   =========================== */

document.getElementById("suggestWarband").onclick = suggestWarband;
document.getElementById("fixRoster").onclick = renderRoster;

/* Initial render */
renderRoster();

</script>
  
</body>
</html>
